name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # кнопка "Run workflow" в GitHub вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      - name: Сгенерировать Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Собрать Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить сгенерированный Wrapper (чтобы закоммитить его)
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: gradle/wrapper/
